<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NDEB AFK Prep Pro</title>

    <!-- Dark mode BEFORE first paint (uses same key as App.tsx: ndeb_theme) -->
    <script>
      (function() {
        var stored = localStorage.getItem('ndeb_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      /* Suppress Google Translate floating icon, spinner, banner, and tooltips entirely */
      html body [class*="VIpgJd"],
      html body .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      html body .VIpgJd-ZVi9od-aZ2wEe-OiiCO,
      html body .VIpgJd-ZVi9od-aZ2wEe,
      html body .VIpgJd-ZVi9od-ORHb-OEVmcd,
      html body .VIpgJd-yAWNEb-hvhgNd-THIOPb,
      html body .goog-te-banner-frame,
      html body .goog-te-balloon-frame,
      html body .goog-te-gadget,
      html body .goog-te-gadget-simple,
      html body .goog-te-gadget-icon,
      html body .goog-tooltip,
      html body .goog-tooltip-skiptranslate,
      html body #goog-gt-tt,
      html body #goog-gt-vt,
      html body #google_translate_element,
      html body iframe.skiptranslate,
      html body .skiptranslate > iframe.skiptranslate {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        z-index: -99999 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        pointer-events: none !important;
        overflow: hidden !important;
      }
      body {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
      }
      .goog-text-highlight {
        background: transparent !important;
        box-shadow: none !important;
      }
    </style>
    <script>
      (function() {
        function hideGTWidget() {
          var els = document.querySelectorAll('[class*="VIpgJd"], .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame');
          for (var i = 0; i < els.length; i++) {
            els[i].style.setProperty('display', 'none', 'important');
            els[i].style.setProperty('visibility', 'hidden', 'important');
            els[i].style.setProperty('opacity', '0', 'important');
            els[i].style.setProperty('pointer-events', 'none', 'important');
          }
        }
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(hideGTWidget);
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', hideGTWidget);
        window.addEventListener('load', hideGTWidget);
      })();
    </script>
      <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Unregistered old service worker');
          }
        });
      }
    </script>
  </head>

  <body>
    <!-- Google Translate widget — outside React root so React never destroys it -->
    <div id="google_translate_element" style="display:none;"></div>
    <div id="root"></div>

    <!--
      Monkey-patch to prevent React crashes from Google Translate DOM mutations.
      Google Translate wraps text nodes in <font> tags. React then tries to
      removeChild / insertBefore those modified nodes and throws NotFoundError.

      Improvements over naive patch:
      - removeChild: delegates to the node's actual parent so it always removes,
        rather than silently no-oping and leaving ghost text.
      - insertBefore: only falls back to append when reference was reparented,
        which is rare; normal insertions are unaffected.
    -->
    <script>
      if (typeof Node === 'function' && Node.prototype) {
        const _removeChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            // Remove from the real parent instead of silently leaving ghost text
            if (child.parentNode) child.parentNode.removeChild(child);
            return child;
          }
          return _removeChild.apply(this, arguments);
        };

        const _insertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, refNode) {
          if (refNode && refNode.parentNode !== this) {
            // Append rather than crash; this only fires when Translate reparented refNode
            return _insertBefore.call(this, newNode, null);
          }
          return _insertBefore.apply(this, arguments);
        };
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,fr',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }
    </script>
    <!-- async defer: never blocks React startup, even on slow connections -->
    <script async defer id="google-translate-script" type="text/javascript"
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
    </script>
  </body>
</html>
