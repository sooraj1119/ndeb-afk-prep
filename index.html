    <title>NDEB AFK Prep Pro</title>
  
    <style>
      /* Nuclear Option for Google Translate Banner */
      iframe.skiptranslate,
      .goog-te-banner-frame,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .skiptranslate > iframe.skiptranslate {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
        z-index: -99999 !important;
        position: absolute !important;
        top: -9999px !important;
      }
      body {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
      }
      .goog-text-highlight {
        background: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>

  <body>
    <div id="google_translate_element" style="display:none;"></div>
    <div id="root"></div>
    
    <script>
      // Google Translate adds <font> tags to text nodes, which breaks React's DOM reconciliation.
      // This monkey-patch prevents React from crashing when it tries to remove a node that Google Translate modified.
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            if (console) {
              console.warn('Cannot remove a child from a different parent', child, this);
            }
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (console) {
              console.warn('Cannot insert before a reference node from a different parent', referenceNode, this);
            }
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en', 
          includedLanguages: 'en,fr',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }
    </script>
    <script id="google-translate-script" type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
